name: Subsplash attendance sync

# ADR-0021. Daily with a 14-day lookback (see scripts/scheduled-sync-subsplash.ts)
# so a missed or failed run self-heals on the next one at zero cost — the
# import endpoint is idempotent per occurrence.
on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC daily
  workflow_dispatch: {} # manual "run now" from the Actions tab, for testing

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      # Only talks to the Subsplash dashboard (Playwright login) and this
      # app's own API (GET /api/attendance/series, POST /api/attendance/import)
      # — never Subsplash's Core API directly, so no SUBSPLASH_CLIENT_ID/SECRET
      # etc. here; those stay app-side (Vercel), not in this workflow.
      - run: npm run sync:subsplash:scheduled
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          ATTENDANCE_IMPORT_TOKEN: ${{ secrets.ATTENDANCE_IMPORT_TOKEN }}
          SUBSPLASH_DASHBOARD_EMAIL: ${{ secrets.SUBSPLASH_DASHBOARD_EMAIL }}
          SUBSPLASH_DASHBOARD_PASSWORD: ${{ secrets.SUBSPLASH_DASHBOARD_PASSWORD }}
          SUBSPLASH_LOGIN_DEBUG_DIR: ${{ runner.temp }}

      # A screenshot of the password *field* only ever shows masked dots, not
      # the value — safe to upload even on a public repo. Short retention
      # since it's a debugging aid, not something to keep around.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: subsplash-login-failure
          path: ${{ runner.temp }}/subsplash-login-failure.png
          if-no-files-found: ignore
          retention-days: 7
